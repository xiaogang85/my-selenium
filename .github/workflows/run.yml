name: 运行我的Selenium

on:
  workflow_dispatch:
    inputs:
      input:
        description: '输入指令 1：稳赢 1：日常'
        required: true
        default: '1 1'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: 安装 Edge 浏览器
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg
          sudo install -d -m 0755 /etc/apt/keyrings
          wget -qO- https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor | sudo tee /etc/apt/keyrings/microsoft.gpg > /dev/null
          sudo chmod a+r /etc/apt/keyrings/microsoft.gpg
          echo 'deb [arch=amd64 signed-by=/etc/apt/keyrings/microsoft.gpg] https://packages.microsoft.com/repos/edge stable main' | sudo tee /etc/apt/sources.list.d/microsoft-edge.list
          sudo apt-get update
          sudo apt-get install -y microsoft-edge-stable

      - name: 运行代码
        run: echo "${{ inputs.input }}" | mvn compile exec:java -Dexec.mainClass="org.example.Main"